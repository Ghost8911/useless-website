<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UI Trap</title>
<style>
:root{--bg:#0e0e0e;--fg:#f2f2f2;--ac:#ffe600;--bad:#ff3b30;--ok:#34c759}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;user-select:none}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:3px solid var(--fg);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:14px}
header.mad{animation:sh .25s;border-color:var(--bad)}
header.mad #rage{color:var(--bad)}
.hdr-r{display:flex;align-items:center;gap:14px}
#mute{background:none;border:2px solid var(--fg);color:var(--fg);font:inherit;font-size:12px;padding:2px 8px;cursor:pointer}
#stage{position:relative;flex:1;overflow:hidden;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
#stage.flash{animation:fl .7s}
@keyframes fl{from{background:#1f3d00}to{background:var(--bg)}}
footer{padding:12px 18px;border-top:3px solid var(--fg);min-height:52px;color:var(--ac);font-weight:700}
h1{font-size:clamp(28px,6vw,56px);margin:0;line-height:1.05;text-transform:uppercase}
p{margin:0;max-width:60ch}
.btn{font:inherit;font-weight:700;padding:14px 26px;background:var(--ac);color:#000;border:3px solid var(--fg);box-shadow:6px 6px 0 var(--fg);cursor:pointer;transition:transform .05s}
.btn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--fg)}
.btn.ghost{background:transparent;color:var(--fg)}
.btn.tiny{font-size:11px;padding:3px 8px;box-shadow:none;opacity:.35;border-width:1px}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.txt{font:inherit;padding:12px 14px;background:#000;color:var(--fg);border:3px solid var(--fg);width:min(80vw,320px)}
.big{font-size:40px;font-weight:700}
.bar{width:min(80vw,520px);height:28px;border:3px solid var(--fg);padding:3px}
.bar i{display:block;height:100%;width:0;background:var(--ac)}
.shake{animation:sh .3s}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.ghost{font-size:30px;font-weight:700;color:var(--bg);user-select:all;-webkit-user-select:all}
.ghost::selection{background:var(--ac);color:#000}
.decoy{color:var(--bad);font-size:22px}
.hint{color:var(--ac)}
.meta{font-size:13px;opacity:.75}
#dot{font-weight:700;font-size:1.3em;cursor:pointer}
</style>
</head>
<body>
<header id="hdr">
  <span>UI Trap</span>
  <span id="lvl">Ready</span>
  <div class="hdr-r">
    <span>😡 rage: <b id="rage">0</b>/100</span>
    <button id="mute" title="Toggle Sound">SFX: ON</button>
  </div>
</header>
<main id="stage"></main>
<footer id="taunt">9 levels. Pass 100 rage and you start over.</footer>
<script>
const $ = s => document.querySelector(s), stage = $('#stage'), hdr = $('#hdr');
const pick = a => a[Math.floor(Math.random() * a.length)];
let lv = 0, rage = 0, t0 = 0, timers = [], rafs = [], cleanup = [], locked = false, misses = 0, muted = false;

let actx;
function tone(freq, dur = 0.08, type = 'square', slide = 0) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, actx.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, actx.currentTime + dur);
    g.gain.setValueAtTime(0.08, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch {}
}

$('#mute').onclick = e => {
  e.stopPropagation();
  muted = !muted;
  $('#mute').textContent = muted ? 'SFX: OFF' : 'SFX: ON';
};

const wins = ['Fine. You got that one.', 'Lucky.', 'Okay, okay.', 'Wow. Took you long enough.', 'Cleared. Do not get cocky.'];
const taunts = ['Not that.', 'Have you tried not failing?', 'Bold strategy.', 'The interface is laughing.', 'Wrong. Confidently wrong.', 'Think outside the mouse.', 'It is not broken. You are.'];

function say(t){ $('#taunt').textContent = t; }
function bump(n = 1){
  if (locked) return;
  rage += n;
  $('#rage').textContent = rage;
  hdr.classList.remove('mad'); void hdr.offsetWidth; hdr.classList.add('mad');
  tone(150, 0.12, 'sawtooth', 85);
  if (rage > 100) rageQuit();
}

function rageQuit(){
  locked = true;
  clear();
  tone(120, 0.4, 'sawtooth', 45);
  $('#lvl').textContent = 'MELTDOWN';
  say('You actually raged out. Back to Level 1.');
  const b = ok(el('button', 'btn', 'Try Again'));
  b.onclick = () => {
    locked = false;
    rage = 0; misses = 0; lv = 0; t0 = Date.now();
    $('#rage').textContent = 0;
    load();
  };
  stage.append(
    el('h1', 0, 'RAGE OVERFLOW'),
    el('p', 0, 'You passed 100 rage. Take a deep breath and start over.'),
    b
  );
}

function el(tag, cls, html){ const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function later(fn, ms){ const id = setTimeout(fn, ms); timers.push(id); return id; }
function frame(fn){
  let active = true;
  const loop = now => { if (!active) return; fn(now); rafs.push(requestAnimationFrame(loop)); };
  rafs.push(requestAnimationFrame(loop));
  cleanup.push(() => active = false);
}
function on(t, ev, fn, o){ t.addEventListener(ev, fn, o); cleanup.push(() => t.removeEventListener(ev, fn, o)); }
function ok(e){ e.dataset.ok = 1; return e; }
function clear(){
  timers.forEach(clearTimeout); timers = [];
  rafs.forEach(cancelAnimationFrame); rafs = [];
  cleanup.forEach(f => f()); cleanup = [];
  stage.innerHTML = ''; document.title = 'UI Trap';
}

document.addEventListener('click', e => {
  if (e.target.closest('[data-ok],#hintbtn,#mute')) return;
  bump(); if (++misses % 3 === 0) say(pick(taunts));
});

function win(){
  if (locked) return; locked = true;
  tone(440, 0.09, 'square', 660);
  later(() => tone(660, 0.14, 'square', 880), 80);
  say(pick(wins)); stage.classList.add('flash');
  later(() => { locked = false; lv++; load(); }, 850);
}

const levels = [
  { title: 'Level 1: Click Next', hint: 'Nobody said you needed the mouse. Tab, then Enter.',
    run(){
      const b = ok(el('button', 'btn', 'Next'));
      b.style.cssText = 'position:absolute;left:calc(50% - 45px);top:62%';
      stage.append(el('p', 0, 'Just click the button.'), b);
      on(document, 'pointermove', e => {
        if (e.pointerType !== 'mouse') return;
        const r = b.getBoundingClientRect(), s = stage.getBoundingClientRect();
        if (Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2)) < 110) {
          const maxX = Math.max(10, s.width - r.width - 20);
          const maxY = Math.max(10, s.height - r.height - 20);
          b.style.left = (Math.random() * maxX + 10) + 'px';
          b.style.top = (Math.random() * maxY + 10) + 'px';
          tone(520, 0.05, 'triangle', 780);
          bump();
        }
      });
      b.onclick = win;
    } },
  { title: 'Level 2: Continue', hint: 'Read the sentence. All the way to the end.',
    run(){
      const row = el('div', 'row');
      ['CONTINUE', 'NEXT ▶', 'GO'].forEach(t => {
        const f = el('button', 'btn', t);
        f.onclick = () => { f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); say('That button is a liar.'); };
        row.append(f);
      });
      const p = el('p', 0, 'Everything you need is in this sentence<span id="dot">.</span>');
      ok(p.querySelector('#dot')).onclick = win;
      stage.append(el('p', 0, 'Pick the right button to continue.'), row, p);
    } },
  { title: 'Level 3: Max Volume', hint: 'Sliders have keyboards. Click it once, then press the End key.',
    run(){
      const s = ok(el('input')); s.type = 'range'; s.min = 0; s.max = 100; s.value = 0; s.style.width = 'min(80vw,520px)';
      const out = el('div', 'big', '0'); let drag = false;
      on(s, 'pointerdown', () => drag = true);
      on(document, 'pointerup', () => drag = false);
      on(s, 'input', () => {
        if (drag && +s.value >= 92) { s.value = Math.floor(Math.random() * 35); bump(); }
        out.textContent = s.value;
        if (+s.value === 100 && !drag) win();
      });
      stage.append(el('p', 0, 'Set the slider to exactly 100.'), s, out);
    } },
  { title: 'Level 4: Loading', hint: 'It will never finish. The faint little button is the honest one.',
    run(){
      const msg = el('p', 0, 'Loading… 0%'), bar = el('div', 'bar', '<i></i>'), fill = bar.firstChild;
      let p = 0, last = performance.now();
      frame(now => {
        const dt = (now - last) / 16.67; last = now;
        p += (Math.random() * 1.1 + 0.25) * dt;
        if (p >= 99) { p = 0; msg.textContent = 'Error at 99%. Retrying…'; bump(); }
        else msg.textContent = 'Loading… ' + Math.floor(p) + '%';
        fill.style.width = p + '%';
      });
      const w = el('button', 'btn', 'Wait'); w.onclick = () => say('It will definitely finish. Probably.');
      const c = ok(el('button', 'btn ghost tiny', 'cancel')); c.onclick = () => { msg.textContent = 'Cancelled.'; win(); };
      stage.append(msg, bar, w, c);
    } },
  { title: 'Level 5: Password', hint: 'Look up. Higher. The browser tab.',
    run(){
      document.title = '🔑 password: RAGEQUIT';
      const i = ok(el('input', 'txt')); i.placeholder = 'password'; i.autocomplete = 'off';
      const b = ok(el('button', 'btn', 'Unlock'));
      const go = () => {
        if (i.value.trim().toLowerCase() === 'ragequit') return win();
        i.value = ''; bump(2); say(pick(['Wrong. Look up.', 'Nope. Higher.', 'Check where you are right now.']));
      };
      b.onclick = go; i.onkeydown = e => { if (e.key === 'Enter') go(); };
      stage.append(el('p', 0, 'Enter the password. It is closer than you think.'), i, b);
    } },
  { title: 'Level 6: The Code', hint: 'You cannot see it. Select everything: Ctrl+A or tap the empty space below.',
    run(){
      const code = String(1000 + Math.floor(Math.random() * 9000));
      const g = ok(el('p', 'ghost', 'CODE: ' + code));
      const i = ok(el('input', 'txt')); i.placeholder = '4 digits'; i.inputMode = 'numeric';
      const b = ok(el('button', 'btn', 'Submit'));
      const go = () => { if (i.value.trim() === code) return win(); i.value = ''; bump(2); say('Wrong code.'); };
      b.onclick = go; i.onkeydown = e => { if (e.key === 'Enter') go(); };
      stage.append(el('p', 0, 'Enter the code shown below.'), el('p', 'decoy', 'CODE: 0000'), g, i, b);
    } },
  { title: 'Level 7: Cookies', hint: 'Banners hate the mouse but love the Escape key.',
    run(){
      const box = el('div', 'row');
      ['Accept all', 'Accept some', 'Manage'].forEach(t => {
        const f = el('button', 'btn', t);
        f.onclick = () => { say('Cookies accepted. All of them. Forever.'); bump(2); };
        box.append(f);
      });
      stage.append(el('p', 0, 'We value your privacy. Please choose.'), box);
      on(document, 'keydown', e => { if (e.key === 'Escape') win(); });
    } },
  { title: 'Level 8: Not a Robot', hint: 'Robots click. Humans press Space. Tab to the box first.',
    run(){
      const c = ok(el('input')); c.type = 'checkbox'; c.style.cssText = 'width:44px;height:44px;cursor:pointer';
      on(c, 'click', e => {
        if (e.detail > 0) { e.preventDefault(); bump(); say('A robot would click. Try again.'); }
        else win();
      });
      stage.append(el('p', 0, 'Prove you are human.'), c, el('p', 0, 'I am not a robot'));
    } },
  { title: 'Level 9: Hold Still', hint: 'Do nothing. No mouse, no keys, no scrolling. Just wait.',
    run(){
      const start = Date.now(); let end = start + 8000;
      const msg = el('p', 0, 'Do nothing for 8 seconds. Do not touch anything.');
      const bar = el('div', 'bar', '<i></i>'), fill = bar.firstChild;
      stage.append(msg, bar);
      const reset = () => {
        if (Date.now() - start < 1200 || locked) return;
        if (end - Date.now() < 7000) { bump(); msg.textContent = 'You moved. Starting over.'; }
        end = Date.now() + 8000;
      };
      ['pointermove', 'pointerdown', 'keydown', 'wheel', 'touchmove'].forEach(ev => on(document, ev, reset, { passive: true }));
      frame(() => {
        const left = end - Date.now();
        fill.style.width = Math.min(100, Math.max(0, 100 - left / 80)) + '%';
        if (left <= 0) win();
      });
    } }
];

function intro(){
  clear();
  $('#lvl').textContent = '9 Levels';
  const best = JSON.parse(localStorage.getItem('uitrap_best') || 'null');
  const startBtn = ok(el('button', 'btn', 'Start Game'));
  startBtn.onclick = () => { locked = false; rage = 0; misses = 0; lv = 0; t0 = Date.now(); $('#rage').textContent = 0; tone(520, 0.08); load(); };
  stage.append(
    el('h1', 0, 'UI Trap'),
    el('p', 0, 'A 9-level hostile interface puzzle. Hit 100 rage and you start over.'),
    startBtn
  );
  if (best) stage.append(el('p', 'meta', `Best Run: ${best.s}s · ${best.rage} rage`));
}

function load(){
  clear(); stage.classList.remove('flash');
  if (lv >= levels.length) return finish();
  const L = levels[lv];
  $('#lvl').textContent = `Level ${lv + 1}/${levels.length}`;
  stage.append(el('h1', 0, L.title)); L.run();
  later(() => {
    const b = el('button', 'btn ghost', 'hint (+5 rage)'); b.id = 'hintbtn';
    b.onclick = () => { bump(5); if (!locked) b.replaceWith(el('p', 'hint', '💡 ' + L.hint)); };
    stage.append(b);
  }, 22000);
}

function finish(){
  const s = Math.round((Date.now() - t0) / 1000);
  const prev = JSON.parse(localStorage.getItem('uitrap_best') || 'null');
  if (!prev || rage < prev.rage || (rage === prev.rage && s < prev.s)) {
    localStorage.setItem('uitrap_best', JSON.stringify({ s, rage }));
  }
  $('#lvl').textContent = 'Cleared';
  say('Now make a friend play it.');
  const row = el('div', 'row');
  const again = ok(el('button', 'btn', 'Play Again'));
  again.onclick = () => { locked = false; rage = 0; misses = 0; lv = 0; t0 = Date.now(); $('#rage').textContent = 0; load(); };
  const share = ok(el('button', 'btn ghost', 'Copy Score'));
  share.onclick = () => {
    navigator.clipboard?.writeText(`UI Trap — Cleared 9/9 in ${s}s with ${rage}/100 rage 😡`);
    share.textContent = 'Copied!';
  };
  row.append(again, share);
  stage.append(el('h1', 0, 'You win.'), el('p', 0, `Time: ${s}s · Rage: ${rage}/100`), row);
}

intro();
</script>
</body>
</html>
